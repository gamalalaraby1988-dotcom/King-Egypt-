name: Founder secure storage Android AAR

on:
  push:
    branches:
      - feature/founder-auth-session-refresh
    paths:
      - "android/plugins/founder_secure_storage/**"
      - "addons/founder_secure_storage/**"
      - ".github/workflows/founder-secure-storage-android.yml"

permissions:
  contents: read

jobs:
  build-aar:
    name: Build FounderSecureStorage AAR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug and release AARs
        working-directory: android/plugins/founder_secure_storage
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :plugin:copyDebugAARToAddon :plugin:copyReleaseAARToAddon
          test -s ../../../../addons/founder_secure_storage/bin/debug/FounderSecureStorage-debug.aar
          test -s ../../../../addons/founder_secure_storage/bin/release/FounderSecureStorage-release.aar

      - name: Upload Android plugin AARs
        uses: actions/upload-artifact@v4
        with:
          name: FounderSecureStorage-AARs
          path: |
            addons/founder_secure_storage/bin/debug/FounderSecureStorage-debug.aar
            addons/founder_secure_storage/bin/release/FounderSecureStorage-release.aar
          if-no-files-found: error
          retention-days: 14
