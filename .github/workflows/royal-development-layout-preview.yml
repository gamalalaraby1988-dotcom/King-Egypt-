name: Royal development district spatial render

on:
  push:
    branches:
      - review/royal-development-mountain-layout
    paths:
      - "scripts/approved_city_layout.gd"
      - "tests/render_camp_area_spatial_preview.gd"
      - ".github/workflows/royal-development-layout-preview.yml"
      - "project.godot"

permissions:
  contents: read

jobs:
  render-actual-city-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Import project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Install headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Render actual Godot city scene
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          xvfb-run -a "$GODOT" --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/render_camp_area_spatial_preview.gd

      - name: Upload actual scene images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: royal-development-mountain-layout-preview
          path: artifacts/royal-development-mountain-preview/
          if-no-files-found: error
          retention-days: 14
