name: Camp area production spatial preview

on:
  push:
    branches: [review/camp-area-spatial-preview]
    paths:
      - "tests/render_camp_area_spatial_preview.gd"
      - ".github/workflows/camp-area-spatial-preview.yml"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "project.godot"

permissions:
  contents: read

jobs:
  render-production-spatial-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Import production project resources
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Install headless display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Render real production city from three spatial angles
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          xvfb-run -a "$GODOT" --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/render_camp_area_spatial_preview.gd

      - name: Upload actual production-scene renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp-area-production-spatial-preview
          path: artifacts/camp-area-spatial-preview/
          if-no-files-found: error
          retention-days: 14
