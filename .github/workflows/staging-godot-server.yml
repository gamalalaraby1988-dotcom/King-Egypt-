name: Staging Godot server container

on:
  pull_request:
    paths:
      - 'deploy/godot-server/**'
      - '.dockerignore'
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/staging-godot-server.yml'
  push:
    branches:
      - 'staging/godot-docker-container'
    paths:
      - 'deploy/godot-server/**'
      - '.dockerignore'
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/staging-godot-server.yml'

permissions:
  contents: read

jobs:
  docker-build:
    name: Build staging server image (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/godot-server/Dockerfile
          push: false
          load: true
          tags: king-city-server:staging-check

      - name: Set up Python for WSS admission test
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install WSS test client
        run: python -m pip install --disable-pip-version-check websockets==12.0

      - name: Create ephemeral TLS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/server.key" \
            -out "$RUNNER_TEMP/server.crt" \
            -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"
          chmod 644 "$RUNNER_TEMP/server.key" "$RUNNER_TEMP/server.crt"
          cat "$RUNNER_TEMP/server.crt" "$RUNNER_TEMP/server.key" > "$RUNNER_TEMP/server.pem"
          chmod 644 "$RUNNER_TEMP/server.pem"

      - name: Start isolated TEST-mode server behind TCP TLS proxy
        run: |
          TEST_HMAC="$(printf '0123456789abcdef0123456789abcdef' | base64 -w0)"
          docker network create king-city-capacity-net

          # The Godot backend has no published host port; only the TLS proxy is exposed.
          docker run -d --name king-city-capacity-smoke \
            --network king-city-capacity-net --network-alias king-city-backend \
            -e KING_CITY_SUPABASE_URL="https://unwrlvyjrtdwobcktetd.supabase.co" \
            -e KING_CITY_SUPABASE_PUBLISHABLE_KEY="sb_publishable_ci_smoke_only" \
            -e KING_CITY_SESSION_SERVER_ID="ci" \
            -e KING_CITY_SESSION_REGION="x" \
            -e KING_CITY_SESSION_ENDPOINT="wss://127.0.0.1:2456" \
            -e KING_CITY_SESSION_DIRECTORY_HMAC_SECRET_B64="$TEST_HMAC" \
            -e KING_CITY_GAME_PORT="2457" \
            -e KING_CITY_SESSION_CAPACITY="64" \
            -e KING_CITY_TRUSTED_PROXY_MODE="1" \
            king-city-server:staging-check

          for attempt in $(seq 1 30); do
            if docker logs king-city-capacity-smoke 2>&1 | grep -q "authoritative WebSocket behind trusted TLS proxy server listening"; then
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' king-city-capacity-smoke)" != "true" ]; then
              docker logs king-city-capacity-smoke
              exit 1
            fi
            sleep 1
          done
          docker logs king-city-capacity-smoke | grep -q "authoritative WebSocket behind trusted TLS proxy server listening"

          docker run -d --name king-city-capacity-proxy \
            --network king-city-capacity-net -p 2456:443 \
            -v "$GITHUB_WORKSPACE/deploy/godot-server/haproxy-capacity-smoke.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            -v "$RUNNER_TEMP/server.pem:/usr/local/etc/haproxy/server.pem:ro" \
            haproxy:3.0-alpine haproxy -W -db -f /usr/local/etc/haproxy/haproxy.cfg

          for attempt in $(seq 1 20); do
            if [ "$(docker inspect -f '{{.State.Running}}' king-city-capacity-proxy)" = "true" ]; then
              sleep 1
              if [ "$(docker inspect -f '{{.State.Running}}' king-city-capacity-proxy)" = "true" ]; then
                exit 0
              fi
            fi
            docker logs king-city-capacity-proxy || true
            sleep 1
          done
          docker logs king-city-capacity-proxy
          echo "Timed out waiting for the TCP TLS proxy to start."
          exit 1

      - name: Diagnose direct backend WebSocket handshake (non-blocking)
        run: |
          if docker run --rm --network king-city-capacity-net python:3.12-slim sh -c "pip install --disable-pip-version-check -q websockets==12.0 && python -c \\"import asyncio,websockets; exec('async def main():\\\\n async with websockets.connect(\\\\'ws://king-city-backend:2457\\\\', subprotocols=[\\\\'binary\\\\'], open_timeout=5):\\\\n  print(\\\\'DIRECT_BACKEND_WEBSOCKET_HANDSHAKE=PASSED\\\\')'); asyncio.run(main())\\"; then
            echo "Direct backend handshake succeeded; inspect proxy path if WSS still fails."
          else
            echo "DIRECT_BACKEND_WEBSOCKET_HANDSHAKE=FAILED; backend listener/protocol is the likely fault domain."
          fi

      - name: Test staged player connection capacity
        run: python tests/authoritative_server_capacity_smoke.py --capacity 64

      - name: Capture server diagnostics
        if: always()
        run: |
          docker logs king-city-capacity-proxy || true
          docker logs king-city-capacity-smoke || true
          docker stats --no-stream king-city-capacity-smoke || true
          docker rm -f king-city-capacity-proxy king-city-capacity-smoke || true
          docker network rm king-city-capacity-net || true
