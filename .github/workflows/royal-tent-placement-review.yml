name: Royal tent city placement review preview

on:
  push:
    branches: [work/main-royal-tent-model]
    paths:
      - 'tests/render_royal_tent_city_placement.gd'
      - '.github/workflows/royal-tent-placement-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placement-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Blender and rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy xvfb libgl1-mesa-dri

      - name: Build exact approved tent GLB
        run: |
          blender --background --python-expr "import sys; sys.path.append('/usr/lib/python3/dist-packages'); import numpy" --python-exit-code 1 --python scripts/build_main_royal_tent.py
          test -s artifacts/main-royal-tent-build/main_royal_tent.glb

      - name: Prepare GLB and install Godot 4.7.2
        run: |
          mkdir -p assets/review
          cp artifacts/main-royal-tent-build/main_royal_tent.glb assets/review/main_royal_tent.glb
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Import project and exact tent GLB
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Render proposed placement in production city scene
        run: |
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          xvfb-run -a "$GODOT" --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/render_royal_tent_city_placement.gd

      - name: Upload placement preview and exact model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: royal-tent-city-placement-review
          path: artifacts/main-royal-tent-build/
          if-no-files-found: error
          retention-days: 14
