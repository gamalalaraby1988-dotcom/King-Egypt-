name: Main royal tent build and exact GLB preview

on:
  push:
    branches: [work/main-royal-tent-model]
    paths:
      - 'scripts/build_main_royal_tent.py'
      - 'tests/render_main_royal_tent.gd'
      - 'tests/render_royal_tent_city_placement.gd'
      - '.github/workflows/main-royal-tent-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validate-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Blender and rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy xvfb libgl1-mesa-dri

      - name: Build isolated main royal tent GLB
        run: |
          blender --background --python-expr "import sys; sys.path.append('/usr/lib/python3/dist-packages'); import numpy; print('NumPy', numpy.__version__)" --python-exit-code 1 --python scripts/build_main_royal_tent.py
          test -s artifacts/main-royal-tent-build/main_royal_tent.glb

      - name: Validate GLB with Khronos validator
        run: |
          npm install --no-save gltf-validator@2.0.0-dev.3.10
          node <<'NODE'
          const fs = require("node:fs");
          const validator = require("gltf-validator");
          (async () => {
            const file = "artifacts/main-royal-tent-build/main_royal_tent.glb";
            const report = await validator.validateBytes(new Uint8Array(fs.readFileSync(file)), {
              uri: file, format: "glb", writeTimestamp: false, maxIssues: 0
            });
            fs.writeFileSync("artifacts/main-royal-tent-build/khronos-report.json", JSON.stringify(report, null, 2) + "\n");
            const issues = report.issues || {};
            console.log(`Khronos: ${issues.numErrors || 0} errors, ${issues.numWarnings || 0} warnings`);
            if ((issues.numErrors || 0) > 0) process.exitCode = 1;
          })().catch(e => { console.error(e); process.exitCode = 1; });
          NODE

      - name: Prepare exact GLB for Godot import
        run: |
          mkdir -p assets/review
          cp artifacts/main-royal-tent-build/main_royal_tent.glb assets/review/main_royal_tent.glb

      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Import exact GLB into Godot
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Render preview from the exact GLB in Godot
        run: |
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          xvfb-run -a "$GODOT" --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/render_main_royal_tent.gd

      - name: Render proposed placement in production city scene
        run: |
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          xvfb-run -a "$GODOT" --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/render_royal_tent_city_placement.gd

      - name: Upload isolated model, validation report, and exact preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-royal-tent-review
          path: artifacts/main-royal-tent-build/
          if-no-files-found: error
          retention-days: 14
