      - name: Run arcade slot machine contract tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-arcade-slot-contract.log"
          set +e
          "$GODOT" --headless --path . --script res://tests/arcade_slot_machine_contract_test.gd 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
