            echo "City NPC social contract tests failed."
            exit 1
          fi

      - name: Run slot machine payout rules tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-slot-machine-rules.log"
          set +e
          "$GODOT" --headless --path . --script res://tests/slot_machine_rules_test.gd 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
