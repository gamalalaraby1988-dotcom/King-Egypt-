name: Godot project check

on:
  push:
    branches: [main, feature/building-quick-travel, feature/offline-city-life, sync-latest-approved-decisions-77-79]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import and headless startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Import resources and check scripts
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-import.log"
          set +e
          "$GODOT" --headless --editor --path . --quit 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Godot import/editor check exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Failed to load|Couldn.t load|Could not load' "$LOG"; then
            echo "Godot reported an error during project import or script checking."
            exit 1
          fi

      - name: Run wallet transaction tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-wallet-tests.log"
          set +e
          "$GODOT" --headless --path . --script res://tests/wallet_manager_test.gd -- --wallet-test 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Wallet transaction tests exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Wallet .* failed|Wallet .* accepted' "$LOG"; then
            echo "Wallet transaction tests reported an error."
            exit 1
          fi

      - name: Run social chat input validation tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-social-tests.log"
          set +e
          timeout --signal=TERM --kill-after=10s 180s "$GODOT" --headless --path . --script res://tests/social_chat_validation_test.gd 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Social chat validation tests exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Social chat .* failed|Social chat .* accepted' "$LOG"; then
            echo "Social chat validation tests reported an error."
            exit 1
          fi

      - name: Run city realtime Presence tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-city-presence-tests.log"
          set +e
          "$GODOT" --headless --path . --script res://tests/city_presence_validation_test.gd 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "City realtime Presence tests exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|CITY_PRESENCE_TESTS: .*failed' "$LOG"; then
            echo "City realtime Presence tests reported an error."
            exit 1
          fi

      - name: Run unified invitation overlay tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-invitation-tests.log"
          set +e
          "$GODOT" --headless --path . --script res://tests/invitation_overlay_test.gd 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Unified invitation overlay tests exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Unified invitation .* failed' "$LOG"; then
            echo "Unified invitation overlay tests reported an error."
            exit 1
          fi

      - name: Run auth session lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-auth-session-tests.log"
          set +e
          "$GODOT" --headless --path . --script res://tests/auth_session_lifecycle_test.gd 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Auth session lifecycle tests exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Auth session .* failed|Auth session .* accepted' "$LOG"; then
            echo "Auth session lifecycle tests reported an error."
            exit 1
          fi

      - name: Start main scene headlessly
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-startup.log"
          set +e
          "$GODOT" --headless --path . --quit-after 10 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Godot main-scene startup exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Failed to load|Couldn.t load|Could not load' "$LOG"; then
            echo "Godot reported an error while starting the main scene."
            exit 1
          fi
