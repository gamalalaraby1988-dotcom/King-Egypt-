name: Godot project check

on:
  push:
    branches: [main, sync-latest-approved-decisions-77-79]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import and headless startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Import resources and check scripts
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-import.log"
          set +e
          "$GODOT" --headless --editor --path . --quit 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Godot import/editor check exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Failed to load|Couldn.t load|Could not load' "$LOG"; then
            echo "Godot reported an error during project import or script checking."
            exit 1
          fi

      - name: Run Egypt calendar and 30-day season tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-calendar-tests.log"
          set +e
          "$GODOT" --headless --path . --script res://tests/game_calendar_test.gd 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Egypt game calendar tests exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Egypt game calendar tests failed' "$LOG"; then
            echo "Egypt game calendar tests reported an error."
            exit 1
          fi

      - name: Run wallet transaction tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-wallet-tests.log"
          set +e
          "$GODOT" --headless --path . --script res://tests/wallet_manager_test.gd 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Wallet transaction tests exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Wallet .* failed|Wallet .* accepted' "$LOG"; then
            echo "Wallet transaction tests reported an error."
            exit 1
          fi

      - name: Run account-switch in-flight sync test
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-account-switch-test.log"
          set +e
          "$GODOT" --headless --path . --script res://tests/player_sync_account_switch_test.gd 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Account-switch in-flight sync test exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Account switch in-flight sync test failed' "$LOG"; then
            echo "Account-switch in-flight sync test reported an error."
            exit 1
          fi

      - name: Run player profile account-switch test
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-player-profile-account-switch-test.log"
          set +e
          "$GODOT" --headless --path . --script res://tests/player_account_profile_account_switch_test.gd 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Player profile account-switch test exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Player profile account-switch test failed' "$LOG"; then
            echo "Player profile account-switch test reported an error."
            exit 1
          fi

      - name: Run approved city delivery jobs catalog tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-city-jobs-tests.log"
          set +e
          "$GODOT" --headless --path . --script res://tests/city_jobs_catalog_test.gd 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "City delivery jobs tests exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|City delivery jobs tests failed' "$LOG"; then
            echo "City delivery jobs tests reported an error."
            exit 1
          fi

      - name: Run online local-transition guard test
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-online-local-transition-test.log"
          set +e
          "$GODOT" --headless --path . --script res://tests/online_local_transition_guard_test.gd 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Online local-transition guard test exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Online local-transition guard test failed' "$LOG"; then
            echo "Online local-transition guard test reported an error."
            exit 1
          fi

      - name: Start main scene headlessly
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/godot-startup.log"
          set +e
          "$GODOT" --headless --path . --quit-after 10 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Godot main-scene startup exited with code $GODOT_STATUS."
            exit "$GODOT_STATUS"
          fi
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Failed to load|Couldn.t load|Could not load' "$LOG"; then
            echo "Godot reported an error while starting the main scene."
            exit 1
          fi
