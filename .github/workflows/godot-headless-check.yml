name: Godot Headless Project Check

on:
  workflow_dispatch:
  push:
    branches:
      - feature/building-quick-travel
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "tests/**"
      - "assets/**"
      - ".github/workflows/godot-headless-check.yml"
  pull_request:
    branches:
      - feature/building-quick-travel
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/godot-headless-check.yml"

permissions:
  contents: read

jobs:
  import-and-startup:
    name: Import project and start main scene
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out approved working branch
        uses: actions/checkout@v4

      - name: Install Godot 4.7 stable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 2 -type f -name 'Godot_*_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" godot-import.log; then
            echo "Godot import reported errors."
            exit 1
          fi

      - name: Run social input validation tests
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/social_chat_validation_test.gd 2>&1 | tee godot-social-tests.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" godot-social-tests.log; then
            echo "Social input validation tests reported errors."
            exit 1
          fi

      - name: Start main scene headlessly
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --quit-after 30 2>&1 | tee godot-startup.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" godot-startup.log; then
            echo "Godot startup reported errors."
            exit 1
          fi

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-headless-check-logs
          path: |
            godot-import.log
            godot-startup.log
            godot-social-tests.log
          if-no-files-found: ignore
          retention-days: 14
