name: Royal waterfront preview check

on:
  push:
    branches: [feature/royal-waterfront-blockout-preview]
    paths:
      - "scripts/royal_waterfront_blockout_preview.gd"
      - "scenes/royal_waterfront_blockout_preview.tscn"
      - ".github/workflows/royal-waterfront-preview-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Import project resources and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/waterfront-import.log"
          set +e
          "$GODOT" --headless --editor --path . --quit 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ] || grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Failed to load|Couldn.t load|Could not load' "$LOG"; then
            echo "Godot import/script validation failed."
            exit 1
          fi

      - name: Start the exact waterfront preview scene headlessly
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
          LOG="/tmp/waterfront-preview-startup.log"
          set +e
          "$GODOT" --headless --path . res://scenes/royal_waterfront_blockout_preview.tscn --quit-after 3 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ] || grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):|Parse Error:|Failed to load|Couldn.t load|Could not load' "$LOG"; then
            echo "Waterfront preview scene failed to start."
            exit 1
          fi

# Re-run validation whenever this workflow definition changes.
