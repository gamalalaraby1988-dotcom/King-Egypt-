<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400">
<rect width="1200" height="1400" fill="#eee8dc"/>
<style>
.t{font: bold 22px Arial;fill:#263238}.s{font:16px Arial;fill:#263238}.b{fill:#f8f1df;stroke:#9b702b;stroke-width:3}.r{fill:#4c555b;stroke:#30383d;stroke-width:2}.g{fill:#d7c7a5;stroke:#a58a5d;stroke-width:2}.w{fill:#8cc5d0;stroke:#397d8b;stroke-width:3}.p{fill:#c7b18c;stroke:#987a4b;stroke-width:3}.road{stroke:#4c555b;stroke-width:26;fill:none;stroke-linecap:round}.walk{stroke:#b89c6c;stroke-width:10;fill:none;stroke-dasharray:12 8}
</style>
<text x="600" y="42" text-anchor="middle" class="t" font-size="30">KING OF EGYPT CITY — مخطط توزيع متراص (مراجعة)</text>
<text x="600" y="72" text-anchor="middle" class="s">مخطط توضيحي للمواقع والطرق المقترحة — ليس مقياسًا تنفيذيًا ولا يغيّر مواقع اللعبة</text>
<text x="600" y="110" text-anchor="middle" class="t">الشمال / ممر رؤية الأهرامات</text>
<g transform="translate(600,180)">
<path d="M-100,-20 L0,-90 L100,-20 Z" class="p"/><path d="M-260,5 L-205,-55 L-150,5 Z" class="p"/><path d="M150,5 L205,-55 L260,5 Z" class="p"/>
<text x="0" y="30" text-anchor="middle" class="s">الأهرامات — إبقاء محور الرؤية مفتوحًا</text>
</g>
<g transform="translate(600,330)">
<rect x="-360" y="-65" width="720" height="150" rx="18" fill="#e0d2b8" stroke="#9b8666" stroke-width="2"/>
<rect x="-260" y="-45" width="130" height="48" rx="8" class="b"/><text x="-195" y="-15" text-anchor="middle" class="s">المسرح</text>
<rect x="-60" y="-45" width="120" height="48" rx="8" class="b"/><text x="0" y="-15" text-anchor="middle" class="s">الملعب</text>
<rect x="140" y="-45" width="130" height="48" rx="8" class="b"/><text x="205" y="-15" text-anchor="middle" class="s">النادي</text>
<rect x="-260" y="22" width="130" height="45" rx="8" class="b"/><text x="-195" y="51" text-anchor="middle" class="s">المدينة المائية</text>
<rect x="-60" y="22" width="120" height="45" rx="8" class="b"/><text x="0" y="51" text-anchor="middle" class="s">السينما</text>
<rect x="140" y="22" width="130" height="45" rx="8" class="b"/><text x="205" y="51" text-anchor="middle" class="s">DAILY ARCADE</text>
</g>
<path d="M180 455 H1020" class="road"/><text x="600" y="445" text-anchor="middle" class="s">شارع وصول ترفيهي — مسار مقترح</text>
<g transform="translate(600,565)">
