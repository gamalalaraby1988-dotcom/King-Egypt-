<rect x="-90" y="-48" width="180" height="95" rx="8" class="b"/><text x="0" y="5" text-anchor="middle" class="t">القصر الملكي</text>
<rect x="120" y="-30" width="110" height="60" rx="8" class="b"/><text x="175" y="5" text-anchor="middle" class="s">البنك</text>
<rect x="-310" y="-30" width="110" height="60" rx="8" class="g"/><text x="-255" y="5" text-anchor="middle" class="s">الشرطة / الإطفاء</text>
<rect x="250" y="-30" width="85" height="60" rx="8" class="g"/><text x="292" y="5" text-anchor="middle" class="s">المحكمة</text>
</g>
<text x="600" y="665" text-anchor="middle" class="s">الميدان الملكي والبوابة — مساحة مفتوحة أمام القصر</text>
<g transform="translate(600,790)">
<rect x="-430" y="-68" width="860" height="145" rx="18" fill="#e0d2b8" stroke="#9b8666" stroke-width="2"/>
<rect x="-380" y="-38" width="150" height="72" rx="8" class="b"/><text x="-305" y="5" text-anchor="middle" class="s">سوبرماركت</text>
<rect x="-205" y="-38" width="140" height="72" rx="8" class="b"/><text x="-135" y="5" text-anchor="middle" class="s">السوق</text>
<rect x="-40" y="-38" width="140" height="72" rx="8" class="b"/><text x="30" y="5" text-anchor="middle" class="s">التوظيف</text>
<rect x="125" y="-38" width="140" height="72" rx="8" class="b"/><text x="195" y="5" text-anchor="middle" class="s">المطعم</text>
<rect x="290" y="-38" width="115" height="72" rx="8" class="b"/><text x="347" y="5" text-anchor="middle" class="s">الخدمات</text>
<text x="0" y="-48" text-anchor="middle" class="s">الحي التجاري — ممر مشاة داخلي ومداخل خلفية للخدمة</text>
</g>
<g transform="translate(600,980)">
<rect x="-340" y="-55" width="680" height="120" rx="18" fill="#e0d2b8" stroke="#9b8666" stroke-width="2"/>
<g class="b"><rect x="-300" y="-25" width="130" height="62" rx="8"/><rect x="-140" y="-25" width="130" height="62" rx="8"/><rect x="20" y="-25" width="130" height="62" rx="8"/><rect x="180" y="-25" width="130" height="62" rx="8"/></g>
<g class="s" text-anchor="middle"><text x="-235" y="10">قصر 1</text><text x="-75" y="10">قصر 2</text><text x="85" y="10">قصر 3</text><text x="245" y="10">قصر 4</text></g>
<text x="0" y="-35" text-anchor="middle" class="s">الحي السكني — حديقة مشتركة ومسار مشاة محيطي</text>
</g>
<path d="M120 1080 H1080" class="road"/>
<g transform="translate(600,1190)">
<rect x="-500" y="-55" width="1000" height="125" rx="18" class="w"/>
<text x="0" y="-15" text-anchor="middle" class="t">الممشى البحري والشاطئ والواجهة المائية</text>
<rect x="-135" y="5" width="270" height="45" rx="8" class="p"/><text x="0" y="34" text-anchor="middle" class="s">مارينا / سفينة الحضارات الخمس</text>
</g>
<text x="600" y="1330" text-anchor="middle" class="s">الجنوب — المارينا والشاطئ والممشى</text>
<text x="600" y="1370" text-anchor="middle" class="s">ملاحظة: مواقع الأطراف والخدمات تُراجع هندسيًا مع طريق الجبل والميناء قبل تثبيت الإحداثيات.</text>
</svg>