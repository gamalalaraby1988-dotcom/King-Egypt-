<text x="800" y="1745" text-anchor="middle" class="sub">الطرق والخطوط المتقطعة تصورية لتوضيح الربط فقط؛ يلزم فحص عرض الطرق والمداخل والتضاريس والتصادمات قبل تثبيت المسارات.</text>
<text x="800" y="1775" text-anchor="middle" class="small">لا يوجد نقل مبانٍ أو تعديل إحداثيات تشغيلية أو دمج في الإنتاج ضمن هذا الملف.</text></svg>