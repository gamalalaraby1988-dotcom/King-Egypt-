<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<defs><style>text{font-family:Arial,sans-serif}.h{font-size:25px;font-weight:bold;fill:#20323b}.s{font-size:15px;fill:#52646b}.lab{font-size:17px;font-weight:bold;fill:#18333d}.small{font-size:13px;fill:#263b42}.dim{font-size:12px;fill:#596970}</style></defs>
<rect width="1200" height="850" fill="#f5f3ed"/>
<text x="600" y="42" text-anchor="middle" class="h">KING OF EGYPT CITY — ROYAL WATERFRONT CONCEPT</text>
<text x="600" y="70" text-anchor="middle" class="s">مخطط كتلي علوي للمراجعة — اتجاهات ومناطق تقريبية وليست أبعاد تنفيذية</text>
<!-- land -->
<rect x="80" y="110" width="1040" height="630" rx="8" fill="#d9cfb5" stroke="#988b70" stroke-width="2"/>
<rect x="100" y="130" width="1000" height="105" fill="#c9b58c" opacity=".55"/>
<text x="600" y="160" text-anchor="middle" class="lab">المدينة والطرق البرية</text>
<rect x="100" y="235" width="1000" height="52" fill="#c5a77b" stroke="#987b50"/>
<text x="600" y="267" text-anchor="middle" class="lab">الكورنيش الساحلي — ممشى بري خلف الشاطئ</text>
<rect x="100" y="287" width="1000" height="125" fill="#e5d2a4" stroke="#b59c69"/>
<text x="600" y="325" text-anchor="middle" class="lab">الشاطئ الرملي المفتوح</text>
<rect x="145" y="340" width="220" height="52" rx="5" fill="#d5bd8a" stroke="#a78e5d"/>
<text x="255" y="370" text-anchor="middle" class="small">منطقة رياضية شاطئية</text>
<rect x="100" y="412" width="1000" height="72" fill="#9bd1d6" stroke="#4c9eaa"/>
<text x="600" y="454" text-anchor="middle" class="lab">مياه ضحلة متدرجة — مشي فقط، مع أرضية وتصادم</text>
<rect x="100" y="484" width="1000" height="236" fill="#287f9b" stroke="#155b78" stroke-width="2"/>
<path d="M100 515 Q250 495 400 520 T700 515 T1000 520" fill="none" stroke="#8dd3df" stroke-width="3" opacity=".75"/>
<path d="M100 565 Q250 545 400 570 T700 565 T1000 570" fill="none" stroke="#8dd3df" stroke-width="2" opacity=".55"/>
<text x="860" y="675" text-anchor="middle" font-size="25" font-weight="bold" fill="#eaf8f8">البحر المفتوح</text>
<!-- bridge -->
<rect x="548" y="384" width="104" height="190" rx="6" fill="#9b9a91" stroke="#514f49" stroke-width="3"/>
<rect x="562" y="385" width="76" height="188" fill="#454c50"/>
<line x1="600" y1="390" x2="600" y2="568" stroke="#f1e4bd" stroke-width="3" stroke-dasharray="12 9"/>
<rect x="550" y="385" width="12" height="188" fill="#d9c28a"/><rect x="638" y="385" width="12" height="188" fill="#d9c28a"/>
<text x="685" y="505" class="small">جسر ملكي</text><text x="685" y="524" class="dim">سيارات باتجاهين</text><text x="685" y="542" class="dim">ومشاة محميون على الجانبين</text>
<!-- ship -->
<g transform="translate(600 625)">
<path d="M-42 -60 L42 -60 L30 60 L-30 60 Z" fill="#e8e1cf" stroke="#a77d2e" stroke-width="4"/>
<rect x="-24" y="-24" width="48" height="45" rx="4" fill="#f4efdf" stroke="#a77d2e" stroke-width="3"/>
<rect x="-14" y="-43" width="28" height="17" fill="#c7a34d"/>
<line x1="0" y1="-55" x2="0" y2="-105" stroke="#b78a32" stroke-width="4"/>
<path d="M3 -102 L40 -90 L3 -78 Z" fill="#d5bd80"/>
<text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#59451e">FIVE</text>
</g>
<text x="690" y="635" class="lab">السفينة الملكية الثابتة</text>
<text x="690" y="658" class="small">منصة وصول متصلة بنهاية الجسر</text>
<!-- access and safety -->
<rect x="516" y="350" width="168" height="34" rx="6" fill="#d4b36c" stroke="#8c6a2a" stroke-width="2"/>
<text x="600" y="373" text-anchor="middle" class="small">ساحة مدخل الجسر</text>
<text x="115" y="780" class="s">ملاحظات: البحر يحل محل الممشى القديم وحوض المارينا. خط الشاطئ والجسر النهائيان يتطلبان قياسًا من المشهد واختبار التصادم قبل التنفيذ.</text>
<text x="115" y="805" class="dim">لا تمثل هذه الصورة مجسم Godot نهائيًا؛ إنها خريطة تخطيطية لتوضيح العلاقات بين المناطق فقط.</text>
</svg>