global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend city_wss_tls
    bind :443 ssl crt /usr/local/etc/haproxy/server.pem
    default_backend godot_websocket

backend godot_websocket
    server city_backend king-city-backend:2457
