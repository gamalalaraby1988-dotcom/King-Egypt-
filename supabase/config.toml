project_id = "lupmaktbymuaymhqsxxu"

# The project uses the new sb_publishable_* API key. Supabase's gateway
# verify_jwt check only supports legacy JWT-based API keys in this mode.
# The function validates the user's Bearer access token itself through
# /auth/v1/user before issuing any founder entitlement.
[functions.founder-entitlement]
verify_jwt = false

# The function validates the caller's Supabase Auth access token via /auth/v1/user.
# Keep this false when using sb_publishable_* keys; the function performs user auth itself.
[functions.player-sync]
verify_jwt = false

# Dedicated game server proof issuer: HMAC is verified in the function before DB insertion.
[functions.game-proof-issuer]
verify_jwt = false

# Dedicated server signs each bounded walking increment; the Edge Function verifies HMAC.
[functions.game-walk-progress]
verify_jwt = false
